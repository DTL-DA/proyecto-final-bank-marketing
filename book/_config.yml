title: "Proyecto final · Cuarto entregable · Bank Marketing"
author: Donny Torres · Maestría en Analítica de Datos, Universidad del Norte
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - html_image

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/DTL-DA/proyecto-final-bank-marketing
  path_to_book: book
  branch: main

html:
  use_repository_button: true
  use_issues_button: false

sphinx:
  config:
    language: es
    nb_merge_streams: true
    nb_render_markdown_format: myst
    nb_code_prompt_show: "Mostrar el código de la celda"
    nb_code_prompt_hide: "Ocultar el código de la celda"
    bibtex_reference_style: author_year
    suppress_warnings: ["myst.header", "bibtex.duplicate_citation"]
    html_theme_options:
      show_toc_level: 2
      use_download_button: true
      use_fullscreen_button: true
      home_page_in_toc: true
